<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one screen. A single large card fills the middle like a place card on the table;
   category switches sit above it, the draw button below it, within thumb reach. */
:root {
  --bg: #E7EBE1;
  --fg: #1B2620;
  --muted: #55635A;
  --surface: #F6F8F2;
  --line: #C3CCBD;
  --cranberry: #8E1C3A;
  --on-cranberry: #FFF1EC;
  --gold: #E3A537;
  --on-gold: #2B1B02;
  --spruce: #24594A;
  --on-spruce: #EEF7F0;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A16; --fg: #E6ECE4; --muted: #9DAA9F; --surface: #1E2822; --line: #36443B;
    --cranberry: #A62548; --on-cranberry: #FFF1EC;
    --gold: #E3A537; --on-gold: #2B1B02;
    --spruce: #2F715E; --on-spruce: #EEF7F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A16; --fg: #E6ECE4; --muted: #9DAA9F; --surface: #1E2822; --line: #36443B;
  --cranberry: #A62548; --on-cranberry: #FFF1EC;
  --gold: #E3A537; --on-gold: #2B1B02;
  --spruce: #2F715E; --on-spruce: #EEF7F0;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.app {
  height: 100%;
  max-width: 1100px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; line-height: 1.1; }
.ghost {
  background: transparent; border: 1.5px solid var(--line); border-radius: 999px;
  padding: 8px 16px; font-weight: 600; min-height: 44px;
}

.cats { display: flex; gap: 8px; flex-wrap: wrap; }
.cat {
  flex: 1 1 auto; min-height: 44px;
  border-radius: 999px; border: 1.5px solid var(--line);
  background: transparent; color: var(--muted);
  padding: 8px 8px; font-weight: 600; font-size: 0.8125rem; white-space: nowrap;
}
.cat[aria-pressed="true"] { border-color: transparent; }
.cat[data-cat="trivia"][aria-pressed="true"] { background: var(--cranberry); color: var(--on-cranberry); }
.cat[data-cat="thankful"][aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.cat[data-cat="table"][aria-pressed="true"] { background: var(--spruce); color: var(--on-spruce); }

.card {
  --card: var(--surface); --on-card: var(--fg);
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  background: var(--card); color: var(--on-card);
  border-radius: 28px;
  padding: clamp(20px, 5vw, 56px);
  display: flex; flex-direction: column; gap: 20px;
}
.card[data-cat="trivia"] { --card: var(--cranberry); --on-card: var(--on-cranberry); }
.card[data-cat="thankful"] { --card: var(--gold); --on-card: var(--on-gold); }
.card[data-cat="table"] { --card: var(--spruce); --on-card: var(--on-spruce); }
.card-main { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.card-text {
  font-family: var(--display);
  font-size: clamp(1.5rem, min(6.4vw, 7vh), 3.6rem);
  line-height: 1.18; margin: 0; text-wrap: balance;
}
.answer {
  background: color-mix(in srgb, var(--on-card) 14%, transparent);
  border-radius: 18px; padding: 16px 18px;
  font-size: clamp(1.05rem, 3.4vw, 1.75rem); font-weight: 500;
}
.answer .ref { display: block; margin-top: 6px; font-size: 0.8em; font-weight: 600; opacity: 0.85; }
.reveal {
  align-self: flex-start;
  background: var(--on-card); color: var(--card);
  border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; min-height: 48px;
}
.card-foot {
  display: flex; justify-content: space-between; gap: 12px;
  font-weight: 600; font-size: 0.875rem; opacity: 0.9;
  font-variant-numeric: tabular-nums;
}
.swap { animation: rise 240ms ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.score { display: flex; flex-wrap: wrap; gap: 8px; }
.team {
  flex: 1 1 150px; min-width: 0;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 6px 8px;
}
.team input {
  flex: 1 1 auto; min-width: 0; width: 100%;
  background: transparent; border: 0; font-weight: 600; padding: 6px 4px;
}
.team .pts { font-family: var(--display); font-size: 1.4rem; min-width: 1.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.team button {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--line); background: transparent; font-weight: 700; font-size: 1.1rem; line-height: 1;
}

.actions { display: flex; gap: 10px; }
.back {
  flex: none; min-height: 60px; padding: 0 22px;
  background: transparent; border: 1.5px solid var(--line); border-radius: 20px; font-weight: 600;
}
.back:disabled { opacity: 0.4; cursor: default; }
.draw {
  flex: 1 1 auto; min-height: 60px;
  background: var(--fg); color: var(--bg);
  border: 0; border-radius: 20px; font-weight: 700; font-size: 1.15rem;
}

dialog {
  width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px);
  border: 0; border-radius: 24px; padding: 0;
  background: var(--bg); color: var(--fg);
}
dialog::backdrop { background: rgb(0 0 0 / 0.5); }
.sheet { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 0; }
.sheet h3 { font-size: 1rem; margin: 0; }
.sheet section { display: flex; flex-direction: column; gap: 10px; }
.sheet p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row input[type="checkbox"] { width: 24px; height: 24px; flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.9rem; }
.field select, .field textarea, .field input {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 10px 12px; font-weight: 400; font-size: 1rem; width: 100%;
}
.field textarea { min-height: 84px; resize: vertical; }
.solid {
  background: var(--fg); color: var(--bg); border: 0; border-radius: 14px;
  padding: 12px 18px; font-weight: 700; min-height: 48px;
}
.mine { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mine li {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface); border-radius: 12px; padding: 10px 12px;
}
.mine span { min-width: 0; overflow-wrap: anywhere; }
.mine button { flex: none; background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; min-height: 40px; }
.note { font-weight: 600; color: var(--fg); }

@media (max-width: 600px) {
  .team { flex-basis: 100%; }
}
@media (min-width: 900px) {
  .top h1 { font-size: 2rem; }
  .cat { font-size: 1rem; }
  .draw, .back { min-height: 72px; font-size: 1.3rem; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>Gratitude Table</h1>
    <button class="ghost" id="open-options" type="button">Options</button>
  </header>

  <div class="cats" role="group" aria-label="Card Types In Play">
    <button class="cat" id="cat-trivia" data-cat="trivia" type="button" aria-pressed="true">Trivia</button>
    <button class="cat" id="cat-thankful" data-cat="thankful" type="button" aria-pressed="true">Thankful For</button>
    <button class="cat" id="cat-table" data-cat="table" type="button" aria-pressed="true">Around The Table</button>
  </div>

  <main class="card" id="card" data-cat="table" aria-live="polite">
    <div class="card-main" id="card-main">
      <p class="card-text" id="card-text">Tell the person on your left one thing you are grateful for about them.</p>
      <button class="reveal" id="reveal" type="button" hidden>Show Answer</button>
      <div class="answer" id="answer" hidden></div>
    </div>
    <div class="card-foot">
      <span id="card-kind">Around The Table</span>
      <span id="card-count"></span>
    </div>
  </main>

  <div class="score" id="score" hidden></div>

  <div class="actions">
    <button class="back" id="back" type="button" disabled>Back</button>
    <button class="draw" id="draw" type="button">Draw A Card</button>
  </div>
</div>

<dialog id="options" aria-labelledby="options-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="options-title">Options</h2>
      <button class="ghost" id="close-options" type="button">Done</button>
    </div>

    <section>
      <label class="row" for="keep-score">
        <span><strong>Keep Score</strong><br><span style="color:var(--muted);font-size:0.9rem">Give a point for each right trivia answer.</span></span>
        <input type="checkbox" id="keep-score">
      </label>
      <button class="ghost" id="add-team" type="button" hidden>Add A Team</button>
    </section>

    <section>
      <h3>Add Your Own Card</h3>
      <form id="add-form">
        <div style="display:flex;flex-direction:column;gap:10px">
          <label class="field" for="new-cat">Card Type
            <select id="new-cat">
              <option value="table">Around The Table</option>
              <option value="thankful">Thankful For</option>
              <option value="trivia">Trivia</option>
            </select>
          </label>
          <label class="field" for="new-text">What The Card Says
            <textarea id="new-text" maxlength="240" placeholder="Who remembers the year the turkey fell on the floor?"></textarea>
          </label>
          <label class="field" for="new-answer" id="new-answer-field" hidden>Answer
            <input id="new-answer" type="text" maxlength="160">
          </label>
          <button class="solid" type="submit">Add Card</button>
          <p class="note" id="add-note" hidden></p>
          <p>Your cards are saved on this phone only.</p>
        </div>
      </form>
      <ul class="mine" id="mine"></ul>
    </section>

    <section>
      <h3>Start Over</h3>
      <p>Shuffles every card back into the deck. Scores stay as they are.</p>
      <button class="ghost" id="restart" type="button">Shuffle The Deck</button>
    </section>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var KIND = { trivia: "Trivia", thankful: "Thankful For", table: "Around The Table" };

  // [question, answer, reference]
  var TRIVIA = [
    ["Jesus healed a group of lepers. How many were healed, and how many came back to thank Him?", "Ten were healed. One came back, and he was a Samaritan.", "Luke 17:11–19"],
    ["Finish the verse: “O give thanks unto the Lord; for He is good: for His ___ endureth for ever.”", "Mercy.", "Psalm 136:1"],
    ["Before the five thousand were fed, what did Jesus do with the loaves?", "He gave thanks, then handed them out.", "John 6:11"],
    ["How many loaves and fish did the boy bring to Jesus?", "Five barley loaves and two small fish.", "John 6:9"],
    ["Which Psalm says, “Enter into His gates with thanksgiving, and into His courts with praise”?", "Psalm 100.", "Psalm 100:4"],
    ["Which prophet prayed with “the voice of thanksgiving” from inside a great fish?", "Jonah.", "Jonah 2:9"],
    ["Who knelt and gave thanks to God three times a day, even when it meant the lions’ den?", "Daniel.", "Daniel 6:10"],
    ["Which letter tells us, “In every thing give thanks”?", "Paul’s first letter to the Thessalonians.", "1 Thessalonians 5:18"],
    ["Which two men prayed and sang praises to God in prison at midnight?", "Paul and Silas.", "Acts 16:25"],
    ["At the Last Supper, what did Jesus do before He gave the bread and the cup to His disciples?", "He gave thanks.", "Luke 22:17–19"],
    ["Which book says, “Every good gift and every perfect gift is from above”?", "James.", "James 1:17"],
    ["Finish the verse: “In every thing by prayer and supplication with ___ let your requests be made known unto God.”", "Thanksgiving.", "Philippians 4:6"],
    ["Who said, “The Lord gave, and the Lord hath taken away; blessed be the name of the Lord”?", "Job.", "Job 1:21"],
    ["Whose song of praise begins, “My soul doth magnify the Lord”?", "Mary, the mother of Jesus.", "Luke 1:46"],
    ["Which widow gave thanks to God in the temple when she saw the infant Jesus?", "Anna, a prophetess.", "Luke 2:36–38"],
    ["Who prayed a prayer of thanks after God gave her a son named Samuel?", "Hannah.", "1 Samuel 2:1"],
    ["What was the first thing Noah did after leaving the ark?", "He built an altar to the Lord.", "Genesis 8:20"],
    ["Finish the verse: “This is the day which the Lord hath made; we will ___ and be glad in it.”", "Rejoice.", "Psalm 118:24"],
    ["Who wrote, “Thanks be unto God for His unspeakable gift”?", "The apostle Paul.", "2 Corinthians 9:15"],
    ["Finish the verse: “Let the peace of God rule in your hearts… and be ye ___.”", "Thankful.", "Colossians 3:15"],
    ["What ship carried the Pilgrims across the Atlantic in 1620?", "The Mayflower.", ""],
    ["In what year was the harvest feast at Plymouth that we remember as the first Thanksgiving?", "1621.", ""],
    ["Which people joined the Pilgrims at that harvest feast?", "The Wampanoag. About ninety men came with their leader, Massasoit.", ""],
    ["About how many days did the 1621 harvest celebration last?", "Three days.", ""],
    ["Which president proclaimed a national day of Thanksgiving in 1863, in the middle of the Civil War?", "Abraham Lincoln.", ""],
    ["Which president issued the first national Thanksgiving proclamation, in 1789?", "George Washington.", ""],
    ["Sarah Josepha Hale campaigned for years for a national Thanksgiving. Which nursery rhyme did she write?", "“Mary Had a Little Lamb.”", ""],
    ["On which day does the United States keep Thanksgiving?", "The fourth Thursday of November.", ""],
    ["About how many passengers sailed on the Mayflower?", "About 102.", ""],
    ["About how long did the Mayflower’s voyage take?", "About 66 days.", ""],
    ["Who showed the Pilgrims how to plant corn in their first spring?", "Squanto, also called Tisquantum.", ""],
    ["Which Plymouth governor wrote the history called “Of Plymouth Plantation”?", "William Bradford.", ""],
    ["What agreement did the Pilgrims sign aboard ship before they went ashore?", "The Mayflower Compact.", ""],
    ["When does Canada celebrate Thanksgiving?", "The second Monday of October.", ""],
    ["Finish the line of the Doxology: “Praise God, from whom all ___ flow.”", "Blessings.", ""],
    ["Finish the hymn line: “Count your many blessings, name them ___.”", "One by one.", ""]
  ];

  var THANKFUL = [
    "Name one way the Lord carried you through this year.",
    "What prayer did God answer for you this year?",
    "Which verse or hymn has meant the most to you lately, and why?",
    "What is something hard from this year that you can now thank God for?",
    "Who first taught you about Jesus? What do you remember about them?",
    "What is a small, ordinary thing you are thankful for today?",
    "What is one thing about our Savior you are most grateful for?",
    "Share a time when someone’s kindness came at just the right moment.",
    "Where do you feel closest to God?",
    "What gift or ability has God given you that you are thankful to use?",
    "Which Thanksgiving from years past do you remember best?",
    "What food on this table are you most thankful for, and who made it?",
    "What is something you learned this year that you are glad to know?",
    "Who is someone not at this table that you thank God for?",
    "What is one thing about your home that you are grateful for?",
    "What made you laugh the hardest this year?",
    "What promise of God are you holding on to right now?",
    "Name a teacher, coach or leader who shaped who you are.",
    "What part of God’s creation fills you with wonder?",
    "What do you hope to be thanking God for next Thanksgiving?",
    "What are you thankful for in your church family?",
    "When did you see God’s hand on our family this year?",
    "What is something your parents or grandparents taught you that you still live by?",
    "What is your earliest memory of a family Thanksgiving?",
    "Which family recipe would you be sad to lose, and who made it first?",
    "What is one thing you are thankful your family went through together?",
    "Who in your family prayed for you when you needed it most?",
    "What is a saying or piece of advice from a family member that you have never forgotten?",
    "What do you hope the children in this family remember about today?"
  ];

  var TABLE = [
    "Tell the person on your left one thing you are grateful for about them.",
    "Tell the person on your right about a time they helped you.",
    "Youngest person here: tell the oldest person one thing you admire about them.",
    "Oldest person here: share a Thanksgiving memory from when you were a child.",
    "Go around the table. Everyone gives one word for this year.",
    "Thank someone here for something they did that they may think nobody noticed.",
    "Name a family tradition you hope never ends.",
    "Everyone tells the cook one dish they loved today.",
    "Share a favorite memory you have with someone at this table.",
    "Who at this table makes you laugh the most? Remind them of a moment.",
    "Choose someone here and tell them how you have seen them grow this year.",
    "Tell the story of how two people at this table met.",
    "Go around the table. Everyone finishes this sentence: “I thank God for this family because…”",
    "Name someone who is missing today, and share a memory of them.",
    "Who here taught you something this year? What was it?",
    "Pick someone at the table and pray a one-sentence prayer of thanks for them.",
    "Tell the person across from you one thing you would like to do together next year.",
    "Who here is most likely to go back for a third helping? Tell them one thing you love about them.",
    "Sing one verse of a favorite hymn of thanks together.",
    "Go around the table and name a blessing for each letter of T-H-A-N-K-S.",
    "Tell a funny family story that gets told every year. If nobody has told it yet, now is the time.",
    "Parents and grandparents: tell one thing you remember about the day a child at this table was born.",
    "Children and grandchildren: tell one thing a parent or grandparent here does that makes you feel loved.",
    "Who in this family are you most like? Say how.",
    "Name a family member from generations past you wish everyone here could have met.",
    "Brothers and sisters: share a favorite memory from growing up together.",
    "Husbands and wives: tell your spouse one thing you are thankful for about them.",
    "Tell the newest member of the family one reason you are glad they are here."
  ];

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
  }

  var custom = load("gt-custom", []);
  if (!Array.isArray(custom)) custom = [];

  function allCards() {
    var out = [];
    TRIVIA.forEach(function (t, i) { out.push({ id: "t" + i, cat: "trivia", text: t[0], answer: t[1], ref: t[2] }); });
    THANKFUL.forEach(function (t, i) { out.push({ id: "g" + i, cat: "thankful", text: t }); });
    TABLE.forEach(function (t, i) { out.push({ id: "a" + i, cat: "table", text: t }); });
    custom.forEach(function (c) { out.push({ id: c.id, cat: c.cat, text: c.text, answer: c.answer || "", ref: "" }); });
    return out;
  }

  var boot = (window.claude && window.claude.hot && window.claude.hot.data) || {};
  var state = {
    cats: boot.cats || { trivia: true, thankful: true, table: true },
    history: boot.history || [],   // card ids in the order drawn
    pos: typeof boot.pos === "number" ? boot.pos : -1,
    shown: boot.shown || {},       // card id -> answer revealed
    scoreOn: load("gt-score-on", false),
    teams: load("gt-teams", [{ name: "Team One", pts: 0 }, { name: "Team Two", pts: 0 }])
  };

  var $ = function (id) { return document.getElementById(id); };
  var card = $("card"), main = $("card-main"), text = $("card-text"), reveal = $("reveal"),
      answer = $("answer"), kind = $("card-kind"), count = $("card-count"),
      back = $("back"), draw = $("draw"), scoreEl = $("score"), dialog = $("options");

  function byId(id) {
    var cards = allCards();
    for (var i = 0; i < cards.length; i++) if (cards[i].id === id) return cards[i];
    return null;
  }
  function inPlay() { return allCards().filter(function (c) { return state.cats[c.cat]; }); }
  function unseen() {
    return inPlay().filter(function (c) { return state.history.indexOf(c.id) === -1; });
  }

  // Pick the next card, changing category from the last one when possible so the types stay mixed.
  function pick() {
    var pool = unseen();
    if (!pool.length) return null;
    var last = byId(state.history[state.history.length - 1]);
    var others = last ? pool.filter(function (c) { return c.cat !== last.cat; }) : pool;
    var from = others.length ? others : pool;
    var kinds = [];
    from.forEach(function (c) { if (kinds.indexOf(c.cat) === -1) kinds.push(c.cat); });
    var k = kinds[Math.floor(Math.random() * kinds.length)];
    var choices = from.filter(function (c) { return c.cat === k; });
    return choices[Math.floor(Math.random() * choices.length)];
  }

  function render(animate) {
    var id = state.history[state.pos];
    var c = id ? byId(id) : null;
    var atEnd = state.pos === state.history.length - 1;
    var left = unseen().length;

    if (state.pos === -1) {
      card.dataset.cat = "table";
      text.textContent = "Tell the person on your left one thing you are grateful for about them.";
      kind.textContent = KIND.table;
      count.textContent = inPlay().length + " Cards";
      reveal.hidden = true; answer.hidden = true;
      draw.textContent = "Draw A Card";
    } else if (!c) {
      card.dataset.cat = "done";
      text.textContent = "That card was removed. Draw the next one.";
      kind.textContent = ""; count.textContent = "";
      reveal.hidden = true; answer.hidden = true;
    } else {
      card.dataset.cat = c.cat;
      text.textContent = c.text;
      kind.textContent = KIND[c.cat];
      count.textContent = "Card " + (state.pos + 1) + " Of " + (state.history.length + left);
      var hasAnswer = !!c.answer;
      var open = !!state.shown[c.id];
      reveal.hidden = !hasAnswer || open;
      answer.hidden = !hasAnswer || !open;
      if (hasAnswer && open) {
        answer.textContent = c.answer;
        if (c.ref) {
          var r = document.createElement("span");
          r.className = "ref"; r.textContent = c.ref;
          answer.appendChild(r);
        }
      }
    }

    if (state.pos > -1) {
      draw.textContent = (atEnd && left === 0) ? "Shuffle And Play Again" : "Draw Next Card";
    }
    if (!inPlay().length) {
      card.dataset.cat = "done";
      text.textContent = "Every card type is switched off. Turn one on above to play.";
      kind.textContent = ""; count.textContent = "";
      reveal.hidden = true; answer.hidden = true;
    }
    back.disabled = state.pos <= 0;

    ["trivia", "thankful", "table"].forEach(function (k) {
      $("cat-" + k).setAttribute("aria-pressed", state.cats[k] ? "true" : "false");
    });

    if (animate) {
      main.classList.remove("swap");
      void main.offsetWidth;
      main.classList.add("swap");
      card.scrollTop = 0;
    }
  }

  function next() {
    keepAwake();
    if (state.pos < state.history.length - 1) { state.pos++; render(true); return; }
    var c = pick();
    if (!c) {
      if (!inPlay().length) { render(false); return; }
      state.history = []; state.pos = -1; state.shown = {};
      c = pick();
    }
    state.history.push(c.id);
    state.pos = state.history.length - 1;
    render(true);
  }
  function prev() {
    if (state.pos > 0) { state.pos--; render(true); }
  }
  function showAnswer() {
    var id = state.history[state.pos];
    if (!id) return;
    state.shown[id] = true;
    render(false);
  }

  var lock = null;
  function keepAwake() {
    if (lock || !navigator.wakeLock) return;
    try {
      navigator.wakeLock.request("screen").then(function (l) {
        lock = l;
        l.addEventListener("release", function () { lock = null; });
      }).catch(function () {});
    } catch (e) { /* not supported */ }
  }

  function renderScore() {
    scoreEl.hidden = !state.scoreOn;
    $("add-team").hidden = !state.scoreOn || state.teams.length >= 6;
    $("keep-score").checked = !!state.scoreOn;
    if (!state.scoreOn) return;
    scoreEl.textContent = "";
    state.teams.forEach(function (t, i) {
      var box = document.createElement("div"); box.className = "team";
      var name = document.createElement("input");
      name.type = "text"; name.id = "team-name-" + i; name.value = t.name; name.maxLength = 18;
      name.setAttribute("aria-label", "Team Name");
      name.addEventListener("input", function () { t.name = name.value; save("gt-teams", state.teams); });
      var minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−";
      minus.setAttribute("aria-label", "Take A Point From " + t.name);
      var pts = document.createElement("span"); pts.className = "pts"; pts.textContent = t.pts;
      var plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+";
      plus.setAttribute("aria-label", "Give A Point To " + t.name);
      minus.addEventListener("click", function () { t.pts = Math.max(0, t.pts - 1); pts.textContent = t.pts; save("gt-teams", state.teams); });
      plus.addEventListener("click", function () { t.pts += 1; pts.textContent = t.pts; save("gt-teams", state.teams); });
      box.appendChild(name); box.appendChild(minus); box.appendChild(pts); box.appendChild(plus);
      scoreEl.appendChild(box);
    });
  }

  function renderMine() {
    var list = $("mine");
    list.textContent = "";
    custom.forEach(function (c) {
      var li = document.createElement("li");
      var span = document.createElement("span"); span.textContent = c.text;
      var rm = document.createElement("button"); rm.type = "button"; rm.textContent = "Remove";
      rm.addEventListener("click", function () {
        custom = custom.filter(function (x) { return x.id !== c.id; });
        save("gt-custom", custom);
        var at = state.history.indexOf(c.id);
        if (at !== -1) {
          state.history.splice(at, 1);
          if (state.pos >= at) state.pos = Math.max(state.history.length ? 0 : -1, state.pos - 1);
        }
        renderMine(); render(false);
      });
      li.appendChild(span); li.appendChild(rm);
      list.appendChild(li);
    });
  }

  draw.addEventListener("click", next);
  back.addEventListener("click", prev);
  reveal.addEventListener("click", showAnswer);

  ["trivia", "thankful", "table"].forEach(function (k) {
    $("cat-" + k).addEventListener("click", function () {
      state.cats[k] = !state.cats[k];
      render(false);
    });
  });

  $("open-options").addEventListener("click", function () {
    $("add-note").hidden = true;
    if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", "");
  });
  $("close-options").addEventListener("click", function () { dialog.close(); });
  dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });

  $("keep-score").addEventListener("change", function (e) {
    state.scoreOn = e.target.checked;
    save("gt-score-on", state.scoreOn);
    renderScore();
  });
  $("add-team").addEventListener("click", function () {
    if (state.teams.length >= 6) return;
    state.teams.push({ name: "Team " + (state.teams.length + 1), pts: 0 });
    save("gt-teams", state.teams);
    renderScore();
  });

  $("new-cat").addEventListener("change", function (e) {
    $("new-answer-field").hidden = e.target.value !== "trivia";
  });
  $("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("new-text").value.trim();
    var note = $("add-note");
    if (!t) {
      note.textContent = "Type what the card should say first.";
      note.hidden = false;
      $("new-text").focus();
      return;
    }
    var cat = $("new-cat").value;
    custom.push({
      id: "c" + Date.now().toString(36),
      cat: cat, text: t,
      answer: cat === "trivia" ? $("new-answer").value.trim() : ""
    });
    save("gt-custom", custom);
    $("new-text").value = ""; $("new-answer").value = "";
    note.textContent = "Card added to the deck.";
    note.hidden = false;
    renderMine(); render(false);
  });

  $("restart").addEventListener("click", function () {
    state.history = []; state.pos = -1; state.shown = {};
    dialog.close();
    render(true);
  });

  document.addEventListener("keydown", function (e) {
    if (dialog.open) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    else if ((e.key === "a" || e.key === "A") && !reveal.hidden) { showAnswer(); }
  });

  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () {
      return { cats: state.cats, history: state.history, pos: state.pos, shown: state.shown };
    });
  }

  renderScore();
  renderMine();
  render(false);
})();
</script>
</body>
</html>
